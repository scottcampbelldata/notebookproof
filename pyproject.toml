[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "notebookproof"
version = "0.1.0"
description = "Check a Jupyter notebook and a dataframe from inside the notebook."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Scott Campbell" }]
keywords = ["jupyter", "notebook", "data-quality", "dataframe"]
classifiers = [
  "Framework :: Jupyter",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/scottcampbelldata/notebookproof"
Repository = "https://github.com/scottcampbelldata/notebookproof"

[tool.setuptools]
py-modules = ["notebookproof"]
