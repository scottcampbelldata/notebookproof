[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "notebookproof"
version = "0.3.0"
description = "Notebook preflight and DataFrame health checks inside Jupyter."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Scott Campbell" }]
keywords = ["jupyter", "notebook", "data-quality", "dataframe"]
classifiers = [
  "Framework :: Jupyter",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
verify = ["nbclient>=0.10", "ipykernel>=6"]
test = ["pytest>=7", "pandas>=1.5", "polars>=0.20", "nbclient>=0.10", "ipykernel>=6"]

[project.urls]
Homepage = "https://github.com/scottcampbelldata/notebookproof"
Repository = "https://github.com/scottcampbelldata/notebookproof"

[tool.setuptools]
py-modules = ["notebookproof"]
